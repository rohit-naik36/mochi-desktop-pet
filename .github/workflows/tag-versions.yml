name: Tag versions

# Every version in package.json gets a git tag (vX.Y.Z) on the last commit
# that carried it, including older versions that were never tagged. When the
# current version gets its tag, the Windows build runs and publishes a Release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tags.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Last commit carrying each version.
          declare -A last
          for c in $(git rev-list --reverse HEAD); do
            v=$(git show "$c:package.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version||"")}catch{console.log("")}})')
            if [ -n "$v" ]; then last[$v]=$c; fi
          done
          for v in "${!last[@]}"; do
            if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then continue; fi
            git tag -a "v$v" "${last[$v]}" -m "Mochi v$v"
            if out=$(git push origin "refs/tags/v$v" 2>&1); then
              echo "::notice::Tagged v$v at ${last[$v]}"
            else
              echo "::error::Could not push v$v: $(echo "$out" | tr '\n' ' ' | tail -c 400)"
            fi
          done
          # Release the current version if it has no GitHub Release yet.
          head_v=$(node -p 'require("./package.json").version')
          if ! gh release view "v$head_v" >/dev/null 2>&1; then
            echo "new_tag=v$head_v" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v$head_v"
          fi
          exit 0

  release:
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    uses: ./.github/workflows/build-windows.yml
    with:
      tag: ${{ needs.tag.outputs.new_tag }}
    secrets: inherit
