name: "Company · PR tests"
# Runs the PR's code with a read-only token and no secrets. Fork PRs get no secrets either.
# Produces the company-tests check for PRs into develop (agent work, release syncs) and into
# main (release PRs).
# Third-party actions are referenced by tag until you run company/scripts/pin-actions.sh,
# which pins each one to the commit SHA the tag points at (review the diff before committing).
on:
  pull_request:
    branches: [develop, main]   # company-tests is required on both branches
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: company-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tests:
    name: company-tests
    if: vars.COMPANY_MODE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Company OS tests
        run: node --test company/test/*.test.mjs
