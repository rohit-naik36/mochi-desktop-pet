<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="pet.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="personality.css">
</head>
<body>
  <div id="veil"></div>
  <div id="bubble-field"></div>
  <div id="fx"></div>
  <div id="orb" class="hidden"></div>

  <div id="pad" class="hidden"></div>
  <div id="shake-hud" class="hidden"><span id="shake-count"></span><button id="shake-done" class="ghost"></button></div>

  <div id="pet-wrap"><div id="pet" class="idle" data-pet-svg></div></div>

  <div id="toolbar">
    <span id="title">Play time</span>
    <nav id="tabs">
      <button data-game="breathe">🌬️ Breathe</button>
      <button data-game="bubbles">🫧 Bubbles</button>
      <button data-game="chase">✨ Chase</button>
      <button data-game="shake">🥊 Shake it out</button>
    </nav>
    <button id="sound" class="icon" title="Sound on/off">🔊</button>
    <button id="close" class="icon" title="Done playing (Esc)">✕</button>
  </div>

  <!-- floats next to the pet -->
  <div id="card" class="hidden">
    <section id="breathe" class="panel">
      <div id="breathe-cue">Breathe with me</div>
      <div id="breathe-count"></div>
      <div id="breathe-dots"></div>
      <button id="breathe-start" class="cta">Start (about a minute)</button>
    </section>
    <section id="bubbles" class="panel">
      <div class="hint">Pop as many or as few as you like. No timer.</div>
      <div id="pop-count" class="counter">0 popped</div>
    </section>
    <section id="chase" class="panel">
      <div class="hint">Move your mouse slowly. I'll follow the light.</div>
      <div id="catch-count" class="counter"></div>
    </section>
    <section id="shake" class="panel">
      <div id="shake-calm" class="hidden">
        <div id="shake-line"></div>
        <div id="shake-breath"></div>
        <div id="shake-dots"></div>
        <div id="shake-q"></div>
        <div id="shake-actions"></div>
      </div>
    </section>
    <section id="worry" class="panel">
      <div class="hint" id="worry-hint">What's weighing on you? I'll eat it. Nothing is saved.</div>
      <textarea id="worry-text" maxlength="280" placeholder="e.g. the deadline on Friday"></textarea>
      <button id="worry-feed" class="cta">Feed it</button>
      <div id="worry-reply" class="hidden">
        <div id="reply-opener"></div>
        <div id="reply-reflect"></div>
        <div id="reply-comfort"></div>
        <div id="reply-helplines" class="hidden"></div>
        <div id="reply-step"></div>
        <div id="reply-ask"></div>
        <div id="reply-actions"></div>
      </div>
    </section>
  </div>

  <div id="worry-letters"></div>
  <div id="speech" class="hidden"></div>

  <script src="pet-svg.js"></script>
  <script src="i18n.js"></script>
  <script src="persona.js"></script>
  <script src="profanity.js"></script>
  <script src="affection.js"></script>
  <script src="progress.js"></script>
  <script src="worry.js"></script>
  <script src="shake-rules.js"></script>
  <script src="ai-prompt.js"></script>
  <script src="play.js"></script>
</body>
</html>
