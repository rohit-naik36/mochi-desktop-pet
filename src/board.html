<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="pet.css">
<link rel="stylesheet" href="board.css">
<title>Achievement board</title>
</head>
<body>
  <header>
    <div class="avatar"><div id="pet" class="happy" data-pet-svg></div></div>
    <div class="who">
      <h1 id="title"></h1>
      <div class="level-row"><span id="level"></span><span id="points"></span></div>
      <div class="bar"><div id="bar-fill"></div></div>
      <div id="to-next" class="muted"></div>
    </div>
    <div class="streak"><div id="streak-n">0</div><div id="streak-label" class="muted"></div></div>
  </header>

  <section>
    <h2><span id="badges-title"></span> <span id="badges-earned" class="muted"></span></h2>
    <div id="badges" class="badges"></div>
  </section>

  <section>
    <h2 id="mood-title"></h2>
    <div id="mood-week" class="mood-week"></div>
  </section>

  <section>
    <h2 id="activity-title"></h2>
    <div id="activity" class="activity"></div>
  </section>

  <section>
    <h2 id="jar-title"></h2>
    <div class="jar-row">
      <div class="jar">🫙</div>
      <div class="jar-text"><div id="jar-count"></div><div id="jar-note" class="note"></div></div>
      <button id="shake"></button>
    </div>
  </section>

  <script src="pet-svg.js"></script>
  <script src="i18n.js"></script>
  <script src="progress.js"></script>
  <script src="board.js"></script>
</body>
</html>
